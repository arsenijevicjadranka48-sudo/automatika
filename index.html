<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigacija</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background: #f0f0f0;
            text-align: center;
        }

        /* Red sa dugmadima */
        .menu {
            display: flex;
            flex-direction: row;
            gap: 12px;
            overflow-x: auto;
            padding: 10px;
            white-space: nowrap;
        }

        .menu button {
            padding: 12px 20px;
            background: #0077cc;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            flex-shrink: 0;
        }

        .menu button:hover {
            background: #005fa3;
        }

        /* Jezički dropdown */
        #lang {
            margin-bottom: 20px;
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 6px;
        }
    </style>
</head>

<body>

    <!-- JEDAN dropdown za jezike -->
    <select id="lang">
        <option value="sr">Srpski</option>
        <option value="en">English</option>
        <option value="de">Deutsch</option>
    </select>

    <!-- SVA dugmad U JEDNOM REDU -->
    <div class="menu">
        <button onclick="go('index')">Početna</button>
        <button onclick="go('kontakt')">Kontakt</button>
        <button onclick="go('reviews')">Recenzije</button>
        <button onclick="go('services')">Usluge</button>
        <button onclick="go('faq')">FAQ</button>
        <button onclick="go('partners')">Partneri</button>
        <button onclick="go('home')">Home</button>
        <button onclick="go('sections')">Sekcije</button>
        <button onclick="go('projekat4')">Projekat 4</button>
        <button onclick="go('projekat5')">Projekat 5</button>
    </div>

    <script>
        function go(page) {
            const lang = document.getElementById("lang").value;

            const map = {
                index: {
                    sr: "index.html",
                    en: "index.html",
                    de: "index.html"
                },
                kontakt: {
                    sr: "kontakt.html",
                    en: "kontakt/index.html",
                    de: "kontakt/index.html"
                },
                reviews: {
                    sr: "reviews-sr.html",
                    en: "reviews-en.html",
                    de: "reviews-en.html"
                },
                services: {
                    sr: "services/index.html",
                    en: "services/index.html",
                    de: "services-de.html"
                },
                faq: {
                    sr: "faq/index.html",
                    en: "faq/index.html",
                    de: "faq/index.html"
                },
                partners: {
                    sr: "partners/index.html",
                    en: "partners/index.html",
                    de: "partners/index.html"
                },
                home: {
                    sr: "home/index.html",
                    en: "home/index.html",
                    de: "home/index.html"
                },
                sections: {
                    sr: "sections/index.html",
                    en: "sections/index.html",
                    de: "sections/index.html"
                },
                projekat4: {
                    sr: "projekat4/index.html",
                    en: "projekat4/index.html",
                    de: "projekat4/index.html"
                },
                projekat5: {
                    sr: "projekat5/index.html",
                    en: "projekat5/index.html",
                    de: "projekat5/index.html"
                }
            };

            window.location.href = map[page][lang];
        }
    </script>

</body>
</html>
