<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Automatika</title>
</head>

<body>

<!-- HEADER -->
<section data-include="header/header.html"></section>

<!-- O NAMA -->
<section data-include="sections
 /about/about.html"></section>

<!-- USLUGE -->
<section data-include=" /service/services.html"></section>

<!-- KONTAKT -->
<section data-include="/contact/contact.html"></section>

<!-- FOOTER -->
<section data-include="footer/footer.html"></section>

<script>
document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll("[data-include]").forEach(async (element) => {
    const file = element.getAttribute("data-include");
    try {
      const response = await fetch(file);
      if (!response.ok) {
        element.innerHTML = `<p style="color:red;">Greška: ne mogu učitati ${file}</p>`;
        return;
      }
      const content = await response.text();
      element.innerHTML = content;
    } catch (error) {
      element.innerHTML = `<p style="color:red;">Greška prilikom učitavanja: ${file}</p>`;
      console.error("Fetch error:", error);
    }
  });
});
</script>

</body>
</html>
