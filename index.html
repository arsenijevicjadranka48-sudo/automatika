<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Automatika PRO</title>

  <style>
    body { margin:0; font-family: Arial, sans-serif; }
    header { 
      display:flex; 
      justify-content:space-between; 
      align-items:center; 
      padding:15px; 
      background:#111; 
      color:#fff; 
      flex-wrap: wrap;
    }
    nav button { 
      margin-left:10px; 
      padding:8px 14px; 
      background:#333; 
      color:#fff; 
      border:none; 
      cursor:pointer; 
    }
    nav button:hover { background:#555; }
    #languages { position:absolute; top:15px; right:20px; }
    #languages select { padding:6px; }
    #content { padding:20px; min-height:300px; }
    footer { margin-top:40px; background:#222; color:#fff; padding:20px; }
  </style>
</head>
<body>

<header>
  <h2>Automatika PRO</h2>

  <div id="languages">
    <select id="langSelect" onchange="changeLanguage(this.value)">
      <option value="bs">Bosanski</option>
      <option value="en">English</option>
      <option value="de">Deutsch</option>
    </select>
  </div>

  <nav>
    <button onclick="loadSection('sections/home.html')">Home</button>
    <button onclick="loadSection('sections/about.html')">About Us</button>
    <button onclick="loadSection('sections/services.html')">Services</button>
    <button onclick="loadSection('sections/projects.html')">Projects</button>
    <button onclick="loadSection('sections/contact.html')">Contact</button>
  </nav>
</header>

<div id="content">
  <p>Dobrodošli na Automatika PRO!</p>
</div>

<footer>
  <p>&copy; 2025 Automatika PRO</p>
</footer>

<script>
  function loadSection(url) {
    fetch(url)
      .then(response => {
        if (!response.ok) throw new Error("Ne mogu učitati sekciju: " + url);
        return response.text();
      })
      .then(html => {
        document.getElementById('content').innerHTML = html;
      })
      .catch(err => {
        document.getElementById('content').innerHTML = "<p style='color:red;'>"+err.message+"</p>";
      });
  }

  function changeLanguage(lang) {
    // Primjer: jednostavna zamjena teksta unutar #content
    // Kasnije se može proširiti za internacionalizaciju više sekcija
    alert("Promijenili ste jezik na: " + lang);
  }

  // Učitavanje početne sekcije
  loadSection('sections/home.html');
</script>

</body>
</html>
