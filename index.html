<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Automatika PRO</title>

  <style>
    body { margin:0; font-family: Arial, sans-serif; }
    header { 
      display:flex; 
      justify-content:space-between; 
      align-items:center; 
      padding:15px; 
      background:#111; 
      color:#fff; 
      flex-wrap: wrap;
    }
    nav button { 
      margin-left:10px; 
      padding:8px 14px; 
      background:#333; 
      color:#fff; 
      border:none; 
      cursor:pointer; 
    }
    nav button:hover { background:#555; }
    #languages { position:absolute; top:15px; right:20px; }
    #languages select { padding:6px; }
    #content { padding:20px; min-height:300px; }
    footer { margin-top:40px; background:#222; color:#fff; padding:20px; }
  </style>
</head>
<body>

<header>
  <h2>Automatika PRO</h2>

  <div id="languages">
    <select id="langSelect">
      <option value="bs">Bosanski</option>
      <option value="en">English</option>
      <option value="de">Deutsch</option>
    </select>
  </div>

  <nav>
    <button onclick="loadSection('home/home.html')">Home</button>
    <button onclick="loadSection('aboutus/aboutus.html')">About Us</button>
    <button onclick="loadSection('services/services.html')">Services</button>
    <button onclick="loadSection('faq/faq.html')">FAQ</button>
    <button onclick="loadSection('partners/partners.html')">Partners</button>
    <button onclick="loadSection('kontakt/contact.html')">Contact</button>
  </nav>
</header>

<div id="content">Učitavam...</div>

<footer id="footer"></footer>

<script>
async function loadSection(path) {
  try {
    const response = await fetch(path);
    if (!response.ok) throw new Error("Greška učitavanja: " + path);
    const html = await response.text();
    document.getElementById("content").innerHTML = html;
  } catch (e) {
    document.getElementById("content").innerHTML =
      '<p style="color:red">Sekcija nije pronađena: ' + path + "</p>";
  }
}

async function loadFooter() {
  try {
    const response = await fetch("footer/footer.html");
    if (!response.ok) throw new Error("Footer fajl ne postoji");
    const html = await response.text();
    document.getElementById("footer").innerHTML = html;
  } catch (e) {
    document.getElementById("footer").innerHTML =
      '<p style="color:red">Footer nije pronađen.</p>';
  }
}

// Učitaj početnu stranicu i footer
loadSection("home/home.html");
loadFooter();
</script>

</body>
</html>
