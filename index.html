<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Automatika Sekcije</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
  header { height: 250px; background-size: cover; background-position: center; transition: background 0.3s ease; }
  nav { display: flex; flex-wrap: wrap; gap: 10px; padding: 10px; background: #333; }
  nav button { color: white; background: #555; border: none; padding: 10px 15px; cursor: pointer; border-radius: 5px; transition: background 0.2s; }
  nav button:hover { background: #777; }
  section { display: none; padding: 20px; border-bottom: 1px solid #ccc; }
  section.active { display: block; }
</style>
</head>
<body>

<header id="header"></header>

<nav>
  <button data-section="home">Home</button>
  <button data-section="faq">FAQ</button>
  <button data-section="services">Services</button>
  <button data-section="kontakt">Kontakt</button>
  <button data-section="partners">Partners</button>
  <button data-section="sections">Sections</button>
  <button data-section="footer">Footer</button>
</nav>

<section id="home">
  <h2>Home Sekcija</h2>
  <p>Ovo je Home sekcija.</p>
</section>

<section id="faq">
  <h2>FAQ Sekcija</h2>
  <p>Ovo je FAQ sekcija.</p>
</section>

<section id="services">
  <h2>Services Sekcija</h2>
  <p>Ovo je Services sekcija.</p>
</section>

<section id="kontakt">
  <h2>Kontakt Sekcija</h2>
  <p>Ovo je Kontakt sekcija.</p>
</section>

<section id="partners">
  <h2>Partners Sekcija</h2>
  <p>Ovo je Partners sekcija.</p>
</section>

<section id="sections">
  <h2>Sections Sekcija</h2>
  <p>Ovo je Sections sekcija.</p>
</section>

<section id="footer">
  <h2>Footer Sekcija</h2>
  <p>Ovo je Footer sekcija.</p>
</section>

<script>
const header = document.getElementById('header');
const buttons = document.querySelectorAll('nav button');
const sections = document.querySelectorAll('section');

buttons.forEach(button => {
  button.addEventListener('click', () => {
    const target = button.dataset.section;

    // Sakrij sve sekcije
    sections.forEach(sec => sec.classList.remove('active'));

    // Prikaži samo izabranu sekciju
    const activeSection = document.getElementById(target);
    if(activeSection) activeSection.classList.add('active');

    // Promeni sliku u headeru
    header.style.backgroundImage = "url('mca.jpg')";
  });
});

// Opcionalno: prikaži Home sekciju po default-u
document.getElementById('home').classList.add('active');
header.style.backgroundImage = "url('mca.jpg')";
</script>

</body>
</html>
