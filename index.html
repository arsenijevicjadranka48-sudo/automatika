<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Automatika PRO</title>
<style>
body { font-family: Arial, sans-serif; margin:0; background:#f2f2f2; }
header { padding:15px; background:#111; color:#fff; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; }
nav { background:#222; padding:10px; flex:1 1 100%; display:flex; flex-wrap:wrap; gap:5px; }
nav button { padding:10px 15px; background:#333; border:none; color:#fff; cursor:pointer; border-radius:4px; }
nav button:hover { background:#555; }
#content { padding:20px; min-height:300px; background:white; margin:20px; border-radius:8px; box-shadow:0 0 10px rgba(0,0,0,0.1); }
.back-home { margin-top:20px; padding:10px 18px; background:#007bff; border:none; color:white; border-radius:6px; cursor:pointer; }
.back-home:hover { background:#0062cc; }
footer { background:#111; color:white; text-align:center; padding:20px; margin-top:30px; }
#langSelect { padding:6px; margin-left:10px; }
</style>
</head>
<body>

<header>
  <h1>Automatika PRO</h1>
  <select id="langSelect" onchange="changeLang(this.value)">
    <option value="bs">Bosanski</option>
    <option value="en">English</option>
    <option value="de">Deutsch</option>
  </select>
</header>

<nav>
  <button onclick="loadHome()">Home</button>
  <button onclick="loadFAQ()">FAQ</button>
  <button onclick="loadAbout()">About</button>
  <button onclick="loadServices()">Services</button>
  <button onclick="loadProjects()">Projects</button>
  <button onclick="loadContact()">Contact</button>
  <button onclick="loadPartners()">Partners</button>
</nav>

<div id="content">Učitavanje...</div>

<footer id="footer">Učitavanje footera...</footer>

<script>
// =======================
// GLOBALNE VARIJABLE
// =======================
let currentLang = "bs";
let currentSectionFunc = null;

// =======================
// JEZIK
// =======================
function changeLang(lang){
  currentLang = lang;
  if(currentSectionFunc) currentSectionFunc();
}

// =======================
// GENERIČKO UČITAVANJE SEKCIJE
// =======================
function loadSection(path){
  fetch(path)
    .then(r => r.ok ? r.text() : "<p style='color:red'>Greška: " + path + "</p>")
    .then(html => {
      document.getElementById("content").innerHTML =
        html + `<button class='back-home' onclick='loadHome()'>⬅ Povratak na početnu</button>`;
    });
}

// =======================
// HOME
// =======================
function loadHome(){
  currentSectionFunc = loadHome;
  let file = "/home/home.html";
  if(currentLang==="en") file = "/home/home-en.html";
  if(currentLang==="de") file = "/home/home-de.html";
  loadSection(file);
}

// =======================
// FAQ
// =======================
function loadFAQ(){
  currentSectionFunc = loadFAQ;
  loadSection("/faq/faq.html");
}

// =======================
// ABOUT
// =======================
function loadAbout(){
  currentSectionFunc = loadAbout;
  let file = "/sections/about-bs.html";
  if(currentLang==="en") file = "/sections/about-en.html";
  if(currentLang==="de") file = "/sections/about-de.html";
  loadSection(file);
}

// =======================
// SERVICES
// =======================
function loadServices(){
  currentSectionFunc = loadServices;
  let file = "/automatika/sections/service/services.html"; // BS
  if(currentLang === "en") file = "/automatika/sections/service/services-en.html";
  if(currentLang === "de") file = "/automatika/sections/service/services-de.html";
  loadSection(file);
}

// =======================
// PROJECTS
// =======================
function loadProjects(){
  currentSectionFunc = loadProjects;
  let file = "/sections/projects-bs.html";
  if(currentLang==="en") file = "/sections/projects-en.html";
  if(currentLang==="de") file = "/sections/projects-de.html";
  loadSection(file);
}

// =======================
// CONTACT
// =======================
function loadContact(){
  currentSectionFunc = loadContact;
  let file = "/sections/contact-bs.html";
  if(currentLang==="en") file = "/sections/contact-en.html";
  if(currentLang==="de") file = "/sections/contact-de.html";
  loadSection(file);
}

// =======================
// PARTNERS
// =======================
function loadPartners(){
  currentSectionFunc = loadPartners;
  let file = "/sections/partners-bs.html";
  if(currentLang==="en") file = "/sections/partners-en.html";
  if(currentLang==="de") file = "/sections/partners-de.html";
  loadSection(file);
}

// =======================
// FOOTER
// =======================
fetch("/footer/footer.html")
  .then(r => r.ok ? r.text() : "Greška učitavanja footera.")
  .then(html => document.getElementById("footer").innerHTML = html);

// =======================
// INIT
// =======================
loadHome();
</script>

</body>
</html>
