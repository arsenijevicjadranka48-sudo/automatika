<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Automatika</title>

  <!-- Osnovni stilovi -->
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; scroll-behavior: smooth; }
    header, footer { background-color: #222; color: #fff; padding: 20px; position: sticky; top: 0; z-index: 1000; }
    nav { display: flex; justify-content: center; }
    nav a {
      display: inline-block;
      padding: 10px 20px;
      background-color: #007BFF;
      color: #fff;
      text-decoration: none;
      border-radius: 5px;
      margin: 0 5px;
      transition: background 0.3s;
    }
    nav a:hover { background-color: #0056b3; }
    section { padding: 60px 20px; border-bottom: 1px solid #ccc; }
  </style>
</head>
<body>

<!-- HEADER sa navigacijom -->
<header>
  <nav>
    <a href="#home">Početna</a>
    <a href="#about">O nama</a>
    <a href="#services">Usluge</a>
    <a href="#kontakt">Kontakt</a>
    <a href="#faq">FAQ</a>
  </nav>
</header>

<!-- HOME SEKCIJE -->
<section id="home" data-include="home/home.html"></section>
<section id="home-de" data-include="home/home-de.html"></section>

<!-- ABOUT SEKCIJA -->
<section id="about" data-include="sections/about.html"></section>

<!-- KONTAKT SEKCIJE -->
<section id="kontakt" data-include="kontakt/contact.html"></section>
<section data-include="kontakt/contactde.html"></section>
<section data-include="kontakt/contacten.html"></section>

<!-- FAQ SEKCIJE -->
<section id="faq" data-include="faq/faq.html"></section>
<section data-include="faq/faqde.html"></section>
<section data-include="faq/faqen.html"></section>

<!-- FOOTER -->
<section data-include="footer/footer.html"></section>

<!-- Skripta za učitavanje sekcija -->
<script>
document.addEventListener("DOMContentLoaded", () => {
  const sections = document.querySelectorAll("[data-include]");
  sections.forEach(async (el) => {
    const path = el.getAttribute("data-include").trim();
    try {
      const res = await fetch(path);
      if (!res.ok) {
        el.innerHTML = `<p style="color:red;">Greška: ne mogu učitati ${path} (status: ${res.status})</p>`;
        console.error("Fetch error:", path, res.status);
        return;
      }
      const html = await res.text();
      el.innerHTML = html;
    } catch (err) {
      el.innerHTML = `<p style="color:red;">Greška prilikom učitavanja ${path}</p>`;
      console.error("Fetch error:", path, err);
    }
  });
});
</script>

</body>
</html>
