<header id="header"></header>

<nav>
  <button data-section="home">Home</button>
  <button data-section="faq">FAQ</button>
  <button data-section="services">Services</button>
  <button data-section="kontakt">Kontakt</button>
  <button data-section="partners">Partners</button>
  <button data-section="sections">Sections</button>
  <button data-section="footer">Footer</button>
</nav>

<!-- Ovde ubaciš stvarni sadržaj iz svojih fajlova -->
<section id="home">
  <!-- Kopiraj sadržaj iz home/index.html ili home.html -->
</section>

<section id="faq">
  <!-- Kopiraj sadržaj iz faq/index.html -->
</section>

<section id="services">
  <!-- Kopiraj sadržaj iz services/index.html -->
</section>

<section id="kontakt">
  <!-- Kopiraj sadržaj iz kontakt/index.html -->
</section>

<section id="partners">
  <!-- Kopiraj sadržaj iz partners/index.html -->
</section>

<section id="sections">
  <!-- Kopiraj sadržaj iz sections/index.html -->
</section>

<section id="footer">
  <!-- Kopiraj sadržaj iz footer/index.html -->
</section>

<script>
const header = document.getElementById('header');
const buttons = document.querySelectorAll('nav button');
const sections = document.querySelectorAll('section');

buttons.forEach(button => {
  button.addEventListener('click', () => {
    const target = button.dataset.section;

    // Sakrij sve sekcije
    sections.forEach(sec => sec.style.display = 'none');

    // Prikaži samo izabranu sekciju
    const activeSection = document.getElementById(target);
    if(activeSection) activeSection.style.display = 'block';

    // Promeni sliku u headeru
    header.style.backgroundImage = "url('mca.jpg')";
  });
});

// Po default-u prikaži Home
document.getElementById('home').style.display = 'block';
header.style.backgroundImage = "url('mca.jpg')";
</script>
