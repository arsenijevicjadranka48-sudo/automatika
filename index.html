<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<title>Automatika PRO</title>

<style>
body { font-family: Arial; margin:0; background:#f2f2f2; }
header { padding:15px; background:#111; color:#fff; }
nav { background:#222; padding:10px; }
nav button { padding:10px 15px; background:#333; border:none; color:#fff; cursor:pointer; border-radius:4px; }
nav button:hover { background:#555; }

#content {
  padding:20px;
  min-height:300px;
  background:white;
  margin:20px;
  border-radius:8px;
  box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.back-home {
  margin-top:20px;
  padding:10px 18px;
  background:#007bff;
  border:none;
  color:white;
  border-radius:6px;
  cursor:pointer;
}
.back-home:hover { background:#0062cc; }

footer {
  background:#111;
  color:white;
  text-align:center;
  padding:20px;
  margin-top:30px;
}
</style>
</head>

<body>

<header>
  <h1>Automatika PRO</h1>
</header>

<nav>
  <button onclick="loadHome()">Home</button>
  <button onclick="loadFAQ()">FAQ</button>
  <button onclick="loadAboutDE()">About DE</button>

  <select id="langSelect" onchange="changeLang(this.value)" style="margin-left:20px; padding:6px;">
    <option value="bs">Bosanski</option>
    <option value="en">English</option>
  </select>
</nav>

<div id="content">Učitavanje...</div>

<footer id="footer">Učitavanje footera...</footer>

<script>
// ******************************
// JEZIK
// ******************************
let currentLang = "bs";

function changeLang(lang) {
  currentLang = lang;
  loadHome(); // reload home when language changes
}

// ******************************
// GENERIČKO UČITAVANJE SEKCIJA
// ******************************
function loadSection(path) {
  fetch(path)
    .then(r => r.ok ? r.text() : "<p style='color:red'>Greška: " + path + "</p>")
    .then(html => {
      document.getElementById("content").innerHTML =
        html + `<button class='back-home' onclick='loadHome()'>⬅ Povratak na početnu</button>`;
    });
}

// ******************************
// HOME
// ******************************
function loadHome() {
  let file = "/home/home.html";

  if (currentLang === "en") file = "/home/home-en.html";

  loadSection(file);
}

// ******************************
// FAQ
// ******************************
function loadFAQ() {
  loadSection("/faq/faq.html");
}

// ******************************
// ABOUT DE
// ******************************
function loadAboutDE() {
  loadSection("/sections/about-de.html");
}

// ******************************
// FOOTER
// ******************************
fetch("/footer/footer.html")
  .then(r => r.ok ? r.text() : "Greška učitavanja footera.")
  .then(html => document.getElementById("footer").innerHTML = html);

// INIT – učitaj početnu
loadHome();
</script>

</body>
</html>
