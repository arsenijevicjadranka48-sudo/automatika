<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automatika – Navigacija</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background: #f0f0f0;
            text-align: center;
        }

        /* Red dugmadi */
        .menu {
            display: flex;
            flex-direction: row;
            gap: 12px;
            overflow-x: auto;
            padding: 10px;
            white-space: nowrap;
        }

        .menu button {
            padding: 12px 20px;
            background: #0077cc;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            flex-shrink: 0;
        }

        .menu button:hover {
            background: #005fa3;
        }

        /* Dropdown za jezik */
        #lang {
            margin-bottom: 20px;
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <!-- Dropdown za izbor jezika -->
    <select id="lang">
        <option value="sr">Srpski</option>
        <option value="en">English</option>
        <option value="de">Deutsch</option>
    </select>

    <!-- Sva dugmad u jednom redu -->
    <div class="menu">
        <button onclick="go('index')">Početna</button>
        <button onclick="go('kontakt')">Kontakt</button>
        <button onclick="go('reviews')">Recenzije</button>
        <button onclick="go('services')">Usluge</button>
        <button onclick="go('faq')">FAQ</button>
        <button onclick="go('partners')">Partneri</button>
        <button onclick="go('home')">Home</button>
        <button onclick="go('sections')">Sekcije</button>
        <button onclick="go('projekat4')">Projekat 4</button>
        <button onclick="go('projekat5')">Projekat 5</button>
    </div>

    <script>
        function go(page) {
            const lang = document.getElementById("lang").value;

            const map = {
                index: { sr: "index.html", en: "index.html", de: "index.html" },
                kontakt: { sr: "kontakt.html", en: "kontakt/contacten.html", de: "kontakt/contacten.html" },
                reviews: { sr: "reviews-sr.html", en: "reviews-en.html", de: "reviews-en.html" },
                services: { sr: "services/services.html", en: "services/servicen.html", de: "services-de.html" },
                faq: { sr: "faq/faq.html", en: "faq/faq-en.html", de: "faq/faq-de.html" },
                partners: { sr: "partners/partners.html", en: "partners/partners-en.html", de: "partners/partners-de.html" },
                home: { sr: "home/home.html", en: "home/home-en.html", de: "home/home-de.html" },
                sections: { sr: "sections/about-bs.html", en: "sections/about-en.html", de: "sections/about-de.html" },
                projekat4: { sr: "projekat4/", en: "projekat4/", de: "projekat4/" },
                projekat5: { sr: "projekat5/", en: "projekat5/", de: "projekat5/" }
            };

            window.location.href = map[page][lang];
        }
    </script>

</body>
</html>
