<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automatika – Navigacija</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f3f3;
            padding: 40px;
            text-align: center;
        }
        h1 {
            margin-bottom: 30px;
        }
        .btn-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            max-width: 900px;
            margin: 0 auto;
        }
        button {
            padding: 15px;
            background: #0077cc;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background: #005fa3;
        }
    </style>
</head>

<body>

    <h1>Automatika – Stranice</h1>

    <div class="btn-container">
        <button onclick="openPage('index.html')">Početna</button>
        <button onclick="openPage('kontakt.html')">Kontakt</button>
        <button onclick="openPage('reviews-sr.html')">Recenzije (SR)</button>
        <button onclick="openPage('reviews-en.html')">Recenzije (EN)</button>
        <button onclick="openPage('services-de.html')">Usluge (DE)</button>
        <button onclick="openPage('faq/index.html')">FAQ</button>
        <button onclick="openPage('home/index.html')">Home</button>
        <button onclick="openPage('kontakt/index.html')">Kontakt (folder)</button>
        <button onclick="openPage('partners/index.html')">Partneri</button>
        <button onclick="openPage('sections/index.html')">Sekcije</button>
        <button onclick="openPage('services/index.html')">Usluge</button>
        <button onclick="openPage('projekat4/index.html')">Projekat 4</button>
        <button onclick="openPage('projekat5/index.html')">Projekat 5</button>
    </div>

    <script>
        function openPage(page) {
            window.location.href = page;
        }
    </script>

</body>
</html>
