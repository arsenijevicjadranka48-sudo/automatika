<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Automatika Modularno</title>
<style>
  body { font-family: Arial, sans-serif; margin:0; padding:0; }
  header { height: 250px; background-size: cover; background-position: center; transition: background 0.3s ease; }
  nav { display: flex; flex-wrap: wrap; gap: 10px; padding: 10px; background:#333; }
  nav button { color:white; background:#555; border:none; padding:10px 15px; cursor:pointer; border-radius:5px; }
  nav button:hover { background:#777; }
  #content { padding:20px; }
</style>
</head>
<body>

<header id="header"></header>

<nav>
  <button data-section="home/index.html">Home</button>
  <button data-section="faq/index.html">FAQ</button>
  <button data-section="services/index.html">Services</button>
  <button data-section="kontakt.html">Kontakt</button>
  <button data-section="partners/index.html">Partners</button>
  <button data-section="sections/index.html">Sections</button>
  <button data-section="footer/index.html">Footer</button>
</nav>

<div id="content">
  <!-- Sadržaj sekcije će se učitati ovdje -->
</div>

<script>
const header = document.getElementById('header');
const content = document.getElementById('content');
const buttons = document.querySelectorAll('nav button');

function loadSection(filePath) {
  fetch(filePath)
    .then(res => res.text())
    .then(html => content.innerHTML = html)
    .catch(err => content.innerHTML = "<p>Greška pri učitavanju sadržaja.</p>");
  header.style.backgroundImage = "url('mca.jpg')";
}

// Poveži dugmiće
buttons.forEach(btn => {
  btn.addEventListener('click', () => {
    const file = btn.dataset.section;
    loadSection(file);
  });
});

// Po default-u učitaj Home
loadSection('home/index.html');
</script>

</body>
</html>
