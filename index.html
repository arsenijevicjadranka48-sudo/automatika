<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<title>Automatika PRO</title>

<style>
body { font-family: Arial; margin:0; background:#f2f2f2;}
header { padding:15px; background:#111; color:#fff;}
nav { background:#222; padding:10px;}
nav button { padding:10px 15px; background:#333; border:none; color:#fff; cursor:pointer; border-radius:4px;}
nav button:hover { background:#555;}

#content {
  padding:20px;
  min-height:300px;
  background:white;
  margin:20px;
  border-radius:8px;
  box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.back-home {
  margin-top:20px;
  padding:10px 18px;
  background:#007bff;
  border:none;
  color:white;
  border-radius:6px;
  cursor:pointer;
}
.back-home:hover { background:#0062cc;}

footer {
  background:#111;
  color:white;
  text-align:center;
  padding:20px;
  margin-top:30px;
}
</style>
</head>

<body>

<header>
  <h1>Automatika PRO</h1>
</header>

<nav>
  <button onclick="loadHome()">Home</button>
  <button onclick="loadFAQ()">FAQ</button>
  <button onclick="loadAbout()">About</button>
  <button onclick="loadAboutDE()">About DE</button>

  <button onclick="loadPartners()">Partners</button>
  <button onclick="loadPartnersDE()">Partners DE</button>
  <button onclick="loadPartnersKE()">Partners KE</button>

  <select id="langSelect" onchange="changeLang(this.value)" style="margin-left:20px; padding:6px;">
    <option value="bs">Bosanski</option>
    <option value="en">English</option>
  </select>
</nav>

<div id="content">Učitavanje...</div>

<footer id="footer">Učitavanje footera...</footer>

<script>
// **************************************
// JEZIK
// **************************************
let currentLang = "bs";

function changeLang(lang) {
  currentLang = lang;
  loadHome();
}

// **************************************
// GENERIČKA FUNKCIJA ZA UČITAVANJE SEKCIJA
// **************************************
function loadSection(path) {
  fetch(path)
    .then(r => r.ok ? r.text() : "<p style='color:red'>Greška prilikom učitavanja: " + path + "</p>")
    .then(html => {
      document.getElementById("content").innerHTML =
        html + `<button class='back-home' onclick='loadHome()'>⬅ Povratak</button>`;
    });
}

// **************************************
// HOME
// **************************************
function loadHome() {
  let file = "/home/home.html";
  if (currentLang === "en") file = "/home/home-en.html";
  loadSection(file);
}

// **************************************
// FAQ
// **************************************
function loadFAQ() { loadSection("/faq/faq.html"); }

// **************************************
// ABOUT – automatski bira prema jeziku
// **************************************
function loadAbout() {
  let file = "/sections/about.html";

  if (currentLang === "en") file = "/sections/about-en.html";

  loadSection(file);
}

// **************************************
// ABOUT DE – posebna stranica
// **************************************
function loadAboutDE() { loadSection("/sections/about-de.html"); }

// **************************************
// PARTNERS SEKCIJE
// **************************************
function loadPartners() { loadSection("/partners/partners.html"); }
function loadPartnersDE() { loadSection("/partners/partnersde.html"); }
function loadPartnersKE() { loadSection("/partners/partnerske.html"); }

// **************************************
// FOOTER
// **************************************
fetch("/footer/footer.html")
  .then(r => r.ok ? r.text() : "Greška učitavanja footera.")
  .then(html => document.getElementById("footer").innerHTML = html);

// START – učitaj početnu stranicu
loadHome();
</script>

</body>
</html>
