<body>

<header>
  <h1>Automatika PRO</h1>

  <nav>
    <button data-path="home/home.html">Početna</button>
    <button data-path="sections/aboutus.html">O nama</button>
    <button data-path="services/services.html">Usluge</button>

  </nav>

  <div id="languages">
    <select id="langSelect">
      <option value="bs">BS</option>
      <option value="en">EN</option>
      <option value="de">DE</option>
    </select>
  </div>
</header>

<!-- Dinamički sadržaj -->
<div id="content"></div>

<!-- Footer -->
<footer id="footer"></footer>

<script>
// ================================
// Dynamic section loader
// ================================
async function loadSection(path) {
  try {
    const response = await fetch(path);
    if (!response.ok) throw new Error("404 - File not found: " + path);
    const html = await response.text();
    document.getElementById("content").innerHTML = html;
  } catch (err) {
    document.getElementById("content").innerHTML =
      "<p style='padding:20px;color:red'>" + err + "</p>";
  }
}

// ================================
// Load footer
// ================================
async function loadFooter() {
  try {
    const res = await fetch("footer/footer.html");
    const html = await res.text();
    document.getElementById("footer").innerHTML = html;
  } catch {
    document.getElementById("footer").innerHTML = "<p style='color:red'>Footer nije pronađen.</p>";
  }
}

// ================================
// Navigation buttons
// ================================
document.querySelectorAll("nav button").forEach(btn => {
  btn.addEventListener("click", () => {
    const section = btn.dataset.path;
    loadSection(section);
  });
});

// ================================
// Default section
// (promijeni ako želiš root kontakt kao početnu)
// ================================
loadSection("home/home.html");

// Footer load
loadFooter();

</script>

</body>
