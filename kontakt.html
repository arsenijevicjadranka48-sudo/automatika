<main>
    <section id="content-display" class="section-content active">
        <iframe id="section-iframe" style="width: 100%; height: 600px; border: 1px solid blue;"></iframe>
    </section>
</main>

<script>
    function loadSectionIframe(filePath) {
        const iframe = document.getElementById('section-iframe');
        iframe.src = filePath;
    }
    
    // Zamenite dugmad sa pozivima za iframe:
    // <button onclick="loadSectionIframe('kontakt.html')">📞 Kontakt (fajl)</button>
    // ...
    
    // Učitaj početni fajl
    loadSectionIframe('index.html');
</script>
