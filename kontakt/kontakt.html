<section id="contact">
  <h2>Kontakt</h2>

  <form action="mailto:halilovicnusret8@gmail.com" method="POST" enctype="text/plain" style="max-width:500px; margin:auto; display:flex; flex-direction:column; gap:10px;">

    <!-- Ime -->
    <input type="text" name="name" placeholder="Vaše ime" required>

    <!-- Email -->
    <input type="email" name="email" placeholder="Vaš e-mail" required>

    <!-- Poruka -->
    <textarea name="message" placeholder="Unesite vašu poruku..." required></textarea>

    <!-- Dugme za slanje -->
    <button type="submit">Pošalji poruku</button>

  </form>
</section>
