<section id="contact">
  <h2>Kontakt</h2>

  <form action="mailto:halilovicnusret8@gmail.com" method="POST" enctype="text/plain" style="max-width:500px; margin:auto; display:flex; flex-direction:column; gap:10px;">

    <!-- Name -->
    <input type="text" name="name" placeholder="Ihr Name" required>

    <!-- Email -->
    <input type="email" name="email" placeholder="Ihre E-Mail" required>

    <!-- Message -->
    <textarea name="message" placeholder="Geben Sie Ihre Nachricht ein..." required></textarea>

    <!-- Submit Button -->
    <button type="submit">Nachricht senden</button>

  </form>
</section>
