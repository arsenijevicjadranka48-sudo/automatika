contact/contact.ht<section id="contact">
  <h2>Contact</h2>

  <form action="mailto:halilovicnusret8@gmail.com" method="POST" enctype="text/plain" style="max-width:500px; margin:auto; display:flex; flex-direction:column; gap:10px;">

    <!-- Name -->
    <input type="text" name="name" placeholder="Your Name" required>

    <!-- Email -->
    <input type="email" name="email" placeholder="Your Email" required>

    <!-- Message -->
    <textarea name="message" placeholder="Enter your message..." required></textarea>

    <!-- Submit Button -->
    <button type="submit">Send Message</button>

  </form>
</section>
