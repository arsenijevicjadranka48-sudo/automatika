<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automatika</title>

    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        header { background: #222; color: #fff; padding: 20px; }
        nav a { color: #fff; margin-right: 15px; text-decoration: none; font-weight: bold; }
        nav a:hover { text-decoration: underline; }
        section { padding: 20px; }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>
        <h1>Automatika</h1>
        <nav>
            <a href="#faq-bs">FAQ (BS)</a>
            <a href="#faq-de">FAQ (DE)</a>
            <a href="#faq-en">FAQ (EN)</a>
        </nav>
    </header>

    <!-- OVDJE ĆE SE UBACITI TVOJE SEKCIJE -->
    <section id="faq-bs"></section>
    <section id="faq-de"></section>
    <section id="faq-en"></section>

    <!-- FUNKCIJA ZA UČITAVANJE -->
    <script>
        function loadSection(path, target) {
            fetch(path)
                .then(res => res.text())
                .then(html => {
                    document.getElementById(target).innerHTML = html;
                })
                .catch(err => console.error("Greška pri učitavanju:", err));
        }

        /* UČITAVAMO TVOJE PRAVE SEKCIJE IZ REPOA */
        loadSection("faq/faq.html", "faq-bs");
        loadSection("faq/faqde.html", "faq-de");
        loadSection("faq/faqen.html", "faq-en");
    </script>

</body>
</html>
